[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afterai"
version = "0.1.0"
description = "A phone-first, open-source AI research and assistant project."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AFTERAI contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
training = [
  "torch>=2.2",
  "transformers>=4.45",
  "datasets>=3.0",
  "peft>=0.13",
  "accelerate>=1.0",
  "sentencepiece>=0.2",
]

[project.scripts]
afterai = "afterai.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
